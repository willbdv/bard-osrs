displayName=Bard
author=willbdv
support=https://github.com/willbdv/bard-osrs/issues
description=Account-aware OSRS assistant. Bring your own LLM (Ollama, OpenRouter, any OpenAI-compatible endpoint).
tags=ai,assistant,llm,wiki,ironman
plugins=com.bardosrs.BardPlugin
build=standard
warning=Bard sends your chat messages to the AI model endpoint you configure, and looks things up on the OSRS Wiki. If you turn on account sharing, your account type, levels, xp and quests (and optionally your bank, inventory and equipment) are sent to that endpoint with each question. These servers are not controlled or verified by RuneLite developers. Only your own character is read.
